
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: dataforge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dataforge -d dataforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_DB: dataforge
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Initialize database
        run: |
          docker run --rm \
            --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD/sql:/sql:ro" \
            postgres:17-alpine \
            psql -h localhost -p 5433 -U dataforge -d dataforge \
            -v ON_ERROR_STOP=1 -f /sql/001_create_tables.sql

      - name: Run tests
        run: uv run pytest tests/ -v
